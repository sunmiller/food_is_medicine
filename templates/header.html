<header>
    <a href="/" aria-label="Go to the home page">
        <img class="site-logo" src="/static/eatforhealing_logo.png" alt="Eat for Healing logo">
    </a>

    <nav id="nav-menu">
        <a href="/" class="{{ 'active' if current_path == '/' else '' }}">Home</a>
        <a href="/about" class="{{ 'active' if current_path == '/about' else '' }}">About</a>
        <a href="/foodfordiabetes" class="{{ 'active' if current_path == '/foodfordiabetes' else '' }}">Food for
            Diabetes</a>
        <a href="/diabetescondition" class="{{ 'active' if current_path == '/diabetescondition' else '' }}">Diabetes</a>
        <a href="/blog" class="{{ 'active' if current_path == '/blog' else '' }}">Blog</a>
        <a href="/events" class="{{ 'active' if current_path == '/events' else '' }}">Events</a>
        <a href="/contact" class="{{ 'active' if current_path == '/contact' else '' }}">Contact</a>
        {% if user_session %}
        <div class="nav-user">
            {% if user_session.picture %}
            <img class="nav-user-avatar" src="{{ user_session.picture }}"
                alt="{{ user_session.name or user_session.email }}">
            {% endif %}
            <div class="nav-user-copy">
                <span class="nav-user-label">Signed in as</span>
                <span class="nav-user-name">{{ user_session.name or user_session.email }}</span>
            </div>
            <a class="nav-logout" href="/logout">Log out</a>
        </div>
        {% else %}
        <a href="/login">Log in/Register</a>
        {% endif %}
    </nav>

    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation menu"
        aria-controls="nav-menu" aria-expanded="false"
        onclick="event.stopImmediatePropagation(); const nav = document.getElementById('nav-menu'); const isActive = nav.classList.toggle('active'); this.setAttribute('aria-expanded', String(isActive));">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>
